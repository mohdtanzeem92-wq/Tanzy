name: Update market data

on:
  schedule:
    # Every weekday, a few times during/after NSE market hours (IST = UTC+5:30)
    # 09:45, 12:45, 15:45, 18:00 IST -> 04:15, 07:15, 10:15, 12:30 UTC
    - cron: "15 4 * * 1-5"
    - cron: "15 7 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/*.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "chore: refresh market data [skip ci]"
          git push
